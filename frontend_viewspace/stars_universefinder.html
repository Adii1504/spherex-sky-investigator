<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniverseFinder-Grade 3D Astronomical Starfield</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020307; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #e2e8f0; }
    #webgl-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; display: block; }
    .space-vignette { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2; background: radial-gradient(circle at center, transparent 30%, rgba(2, 3, 7, 0.4) 70%, rgba(2, 3, 7, 0.85) 100%); }
    .hud-header { position: fixed; top: 24px; left: 28px; z-index: 10; pointer-events: none; }
    .hud-title { font-size: 1.15rem; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: #ffffff; display: flex; align-items: center; gap: 10px; }
    .badge-live { font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; background: rgba(0, 229, 255, 0.15); color: #00e5ff; border: 1px solid rgba(0, 229, 255, 0.4); padding: 2px 7px; border-radius: 4px; }
    .hud-subtitle { font-size: 0.8rem; color: #8c9bb5; margin-top: 4px; }
    .hud-stats { position: fixed; bottom: 24px; left: 28px; z-index: 10; pointer-events: none; background: rgba(14, 18, 32, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 10px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.75rem; display: flex; flex-direction: column; gap: 4px; color: #94a3b8; }
    .hud-stats span strong { color: #00e5ff; font-weight: 600; }
    .hud-controls { position: fixed; bottom: 24px; right: 28px; z-index: 10; display: flex; gap: 8px; }
    .btn-ctrl { background: rgba(14, 18, 32, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12); color: #f1f5f9; font-size: 0.8rem; font-weight: 500; padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
    .btn-ctrl:hover { background: rgba(0, 229, 255, 0.2); border-color: #00e5ff; color: #ffffff; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="space-vignette"></div>
  <header class="hud-header">
    <div class="hud-title">
      <span>UNIVERSE FINDER</span>
      <span class="badge-live">WebGL 3D</span>
    </div>
    <div class="hud-subtitle">Interactive Real-Scale Starfield Engine</div>
  </header>
  <div class="hud-stats">
    <span>Stars: <strong id="statCount">18,000</strong></span>
    <span>Spectral Types: <strong>O • B • A • F • G • K • M</strong></span>
    <span>FPS: <strong id="statFPS">60</strong></span>
    <span>Depth Range: <strong>0.1 - 3,500 pc</strong></span>
  </div>
  <div class="hud-controls">
    <button class="btn-ctrl" id="btnToggleMotion">Pause Drift</button>
    <button class="btn-ctrl" id="btnWarpSpeed">Hyper-Warp</button>
    <button class="btn-ctrl" id="btnResetView">Reset View</button>
  </div>
  <canvas id="webgl-canvas"></canvas>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020307, 0.00065);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
    camera.position.set(0, 0, 1000);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    function generateStarTexture() {
      const size = 128;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      const center = size / 2;
      const gradient = ctx.createRadialGradient(center, center, 0, center, center, center);
      gradient.addColorStop(0.00, 'rgba(255, 255, 255, 1.0)');
      gradient.addColorStop(0.10, 'rgba(240, 248, 255, 0.9)');
      gradient.addColorStop(0.25, 'rgba(180, 215, 255, 0.45)');
      gradient.addColorStop(0.55, 'rgba(80, 140, 255, 0.15)');
      gradient.addColorStop(0.85, 'rgba(20, 60, 180, 0.03)');
      gradient.addColorStop(1.00, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      const texture = new THREE.CanvasTexture(c);
      texture.needsUpdate = true;
      return texture;
    }

    const stellarSpectralPalette = [
      new THREE.Color(0x9bb0ff),
      new THREE.Color(0xbbccff),
      new THREE.Color(0xfbf8ff),
      new THREE.Color(0xfff5ea),
      new THREE.Color(0xffecd0),
      new THREE.Color(0xffcc8f),
      new THREE.Color(0xffa050),
    ];

    const starCount = 18000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(starCount * 3);
    const colors = new Float32Array(starCount * 3);
    const sizes = new Float32Array(starCount);

    for (let i = 0; i < starCount; i++) {
      const radius = 100 + Math.random() * 2200;
      const theta = Math.random() * Math.PI * 2;
      const phi = (Math.random() - 0.5) * Math.PI * 0.45;
      positions[i * 3 + 0] = radius * Math.cos(phi) * Math.cos(theta);
      positions[i * 3 + 1] = radius * Math.sin(phi) * 0.5;
      positions[i * 3 + 2] = radius * Math.cos(phi) * Math.sin(theta);

      const col = stellarSpectralPalette[Math.floor(Math.random() * stellarSpectralPalette.length)];
      colors[i * 3 + 0] = col.r;
      colors[i * 3 + 1] = col.g;
      colors[i * 3 + 2] = col.b;

      const magRand = Math.random();
      sizes[i] = (magRand * magRand * 18.0) + 2.5;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const starMaterial = new THREE.PointsMaterial({
      size: 5.5,
      map: generateStarTexture(),
      vertexColors: true,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });

    const starPoints = new THREE.Points(geometry, starMaterial);
    scene.add(starPoints);

    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;
    let isDrifting = true;
    let isWarping = false;
    let baseSpeed = 0.0008;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) * 0.0004;
      mouseY = (e.clientY - window.innerHeight / 2) * 0.0004;
    });

    window.addEventListener('wheel', (e) => {
      camera.position.z += e.deltaY * 0.6;
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, 200, 2400);
    }, { passive: true });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.getElementById('btnToggleMotion').addEventListener('click', (e) => {
      isDrifting = !isDrifting;
      e.target.textContent = isDrifting ? "Pause Drift" : "Resume Drift";
    });

    document.getElementById('btnWarpSpeed').addEventListener('click', (e) => {
      isWarping = !isWarping;
      e.target.textContent = isWarping ? "Exit Warp" : "Hyper-Warp";
    });

    document.getElementById('btnResetView').addEventListener('click', () => {
      camera.position.set(0, 0, 1000);
      targetX = 0;
      targetY = 0;
    });

    const clock = new THREE.Clock();
    let frameCount = 0;
    let lastFPSUpdate = performance.now();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      frameCount++;
      const now = performance.now();
      if (now - lastFPSUpdate >= 500) {
        document.getElementById('statFPS').textContent = Math.round((frameCount * 1000) / (now - lastFPSUpdate));
        frameCount = 0;
        lastFPSUpdate = now;
      }

      if (isDrifting) {
        const speed = isWarping ? 0.08 : baseSpeed;
        starPoints.rotation.y += speed;
        starPoints.rotation.x += speed * 0.35;
        if (isWarping) {
          camera.position.z -= 8.0;
          if (camera.position.z < 250) camera.position.z = 2000;
        }
      }

      targetX += (mouseX - targetX) * 0.05;
      targetY += (mouseY - targetY) * 0.05;

      camera.position.x += (targetX * 500 - camera.position.x) * 0.05;
      camera.position.y += (-targetY * 500 - camera.position.y) * 0.05;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
