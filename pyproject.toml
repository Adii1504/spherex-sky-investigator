[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spherex-whylab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "astropy>=7,<9", "scipy>=1.15,<2", "pillow>=11,<14", "truststore>=0.10,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["whylab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
