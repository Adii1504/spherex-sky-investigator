[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spherex-whylab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "astropy>=7,<9", "scipy>=1.15,<2", "pillow>=11,<14", "truststore>=0.10,<1", "matplotlib>=3.9,<4", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dataspace = ["pandas>=2.2,<4", "astroquery>=0.4.7,<1", "requests>=2.32,<3", "pyvo>=1.5,<2"]

[tool.setuptools.packages.find]
include = ["whylab*", "backend*"]

[tool.setuptools]
py-modules = ["teammate_integration"]

[tool.setuptools.package-data]
whylab = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/processing/tests"]
